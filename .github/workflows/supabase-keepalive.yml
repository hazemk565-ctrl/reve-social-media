name: Supabase keep-alive

# Pings the Supabase project once a day so the free plan never pauses it for inactivity.
# Uses the public anon key (the same key already shipped in the website's JS).
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl --fail --silent --show-error --max-time 30 \
            -H "apikey: sb_publishable_ob-SuHykxKNKwdmLBrfOyA_NOEvxxGZ" -H "Authorization: Bearer sb_publishable_ob-SuHykxKNKwdmLBrfOyA_NOEvxxGZ" \
            "https://dymkhiutrkvyuonimcpl.supabase.co/rest/v1/settings?select=key&limit=1"
